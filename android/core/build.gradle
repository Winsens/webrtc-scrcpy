plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.webrtc.scrcpy.core'
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Single source of truth for H5 frontend is root web/, synced into assets/web/ during build
    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/webAssets"
        }
    }
}

def syncWebAssets = tasks.register('syncWebAssets', Sync) {
    from "${rootProject.projectDir}/web"
    into "$buildDir/generated/webAssets/web"
}
preBuild.dependsOn(syncWebAssets)

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    api 'androidx.core:core-ktx:1.9.0'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

    // Google WebRTC Android SDK local Jar
    api files('libs/webrtc.jar')

    // Embedded lightweight HTTP & WebSocket server (exposed via api to app module)
    api 'org.nanohttpd:nanohttpd:2.3.1'
    api 'org.nanohttpd:nanohttpd-websocket:2.3.1'
}
