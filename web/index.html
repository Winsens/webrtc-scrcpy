<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC-Scrcpy Remote Control</title>
    <link rel="preload" href="css/style.css" as="style">
    <link rel="preload" href="js/protocol.js" as="script">
    <link rel="preload" href="js/webrtc.js" as="script">
    <link rel="preload" href="js/app.js" as="script">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <!-- Top Status Bar -->
        <header id="header-bar">
            <div class="brand">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
                </svg>
                WebRTC-<span>Scrcpy</span>
            </div>

            <div class="connection-status">
                <div id="status-indicator" class="indicator"></div>
                <span id="status-text">Initializing...</span>
            </div>

            <div class="header-actions">
                <button id="btn-audio" class="tool-btn">🔇 Audio Off</button>
                <button id="btn-clipboard" class="tool-btn">📋 Text Input</button>
                <button id="btn-stats" class="tool-btn">📊 Stats</button>
            </div>
        </header>

        <!-- Real-time Stats Overlay -->
        <div id="stats-overlay" class="hidden">
            <div class="stat-row"><span class="stat-label">FPS:</span><span id="stat-fps" class="stat-value">0</span></div>
            <div class="stat-row"><span class="stat-label">RTT:</span><span id="stat-rtt" class="stat-value">0 ms</span></div>
            <div class="stat-row"><span class="stat-label">Bitrate:</span><span id="stat-bitrate" class="stat-value">0 kbps</span></div>
            <div class="stat-row"><span class="stat-label">Resolution:</span><span id="stat-res" class="stat-value">-</span></div>
            <div class="stat-row"><span class="stat-label">Packet Loss:</span><span id="stat-loss" class="stat-value">0</span></div>
        </div>

        <!-- Screen Display Viewport -->
        <main id="screen-wrapper">
            <div id="screen-content">
                <video id="remote-video" autoplay playsinline muted></video>
                <div id="touch-overlay"></div>
            </div>
        </main>

        <!-- Bottom Virtual Navigation Bar -->
        <nav id="navbar">
            <button id="btn-back" class="nav-item" title="Back (Escape / Right Click)">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                <span>Back</span>
            </button>

            <button id="btn-home" class="nav-item" title="Home (Middle Click)">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </button>

            <button id="btn-recents" class="nav-item" title="Recents">
                <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                <span>Recents</span>
            </button>

            <button id="btn-rotate" class="nav-item" title="Rotate Screen">
                <svg viewBox="0 0 24 24"><path d="M7.11 8.53L5.7 7.11C4.8 8.27 4.24 9.61 4.07 11h2.02c.14-.87.49-1.72 1.02-2.47zM6.09 13H4.07c.17 1.39.72 2.73 1.62 3.89l1.41-1.42c-.52-.75-.87-1.6-1.01-2.47zm10.8-4.47l1.41-1.41C17.4 5.82 16.06 5.27 14.68 5.1v2.02c.87.14 1.72.49 2.21 1.41zm0 7.07c-.49.92-1.34 1.27-2.21 1.41v2.02c1.38-.17 2.72-.72 3.62-1.89l-1.41-1.54z"/></svg>
                <span>Rotate</span>
            </button>

            <button id="btn-vol-down" class="nav-item" title="Volume -">
                <svg viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
                <span>Vol -</span>
            </button>

            <button id="btn-vol-up" class="nav-item" title="Volume +">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <span>Vol +</span>
            </button>

            <button id="btn-power" class="nav-item" title="Power Button">
                <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
                <span>Power</span>
            </button>
        </nav>
    </div>

    <script src="js/protocol.js"></script>
    <script src="js/webrtc.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
